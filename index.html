<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Contactkaart van Sammie Heggers">
<title>Contactkaart – Sammie Heggers</title>
<style>
:root{--bg:#ecebea;--ink:#1c1b22;--muted:#6b6872;--card:#ffffff;--line:#e6e3e6;--accent:#1f5a3d;--accent-ink:#fff;--tab:#1f5a3d;--g1:#f0c3cf;--g2:#f6eef0;--qrbg:#fff;--qrfg:#1c1b22;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17161b;--ink:#f3eef1;--muted:#a49ea8;--card:#24222a;--line:#34313a;--accent:#2b6e4a;--accent-ink:#fff;--tab:#7fbf9c;--g1:#5a2a40;--g2:#24222a;--qrbg:#fff;--qrfg:#1c1b22}}
:root[data-theme="dark"]{--bg:#17161b;--ink:#f3eef1;--muted:#a49ea8;--card:#24222a;--line:#34313a;--accent:#2b6e4a;--accent-ink:#fff;--tab:#7fbf9c;--g1:#5a2a40;--g2:#24222a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;padding:24px 16px 40px}
.tabs{display:flex;gap:4px;padding:5px;border:1.5px solid var(--tab);border-radius:999px;margin-bottom:24px}
.tabs button{font:inherit;font-size:16px;font-weight:500;border:0;background:none;color:var(--tab);padding:10px 22px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--tab);color:#fff}
.tabs button:focus-visible,.btn:focus-visible,.acc:focus-visible,a:focus-visible{outline:3px solid var(--tab);outline-offset:2px}
.phone{width:100%;max-width:440px;border-radius:28px;background:var(--card);overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.12)}
.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:96px;height:26px;border-radius:20px;background:#151822;z-index:2}
.status{position:absolute;top:12px;left:24px;right:24px;display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:#1c1b22;z-index:1}
.hero{background:linear-gradient(var(--g1),var(--g2));padding:44px 20px 22px;text-align:center}
.avatar{object-fit:cover;width:128px;height:128px;border-radius:50%;margin:0 auto 14px;border:3px solid rgba(255,255,255,.85);background:#3a3640;color:#f3eef1;display:grid;place-items:center;font-size:40px;font-weight:600;letter-spacing:1px}
h1{margin:0 0 16px;font-size:24px;font-weight:700;color:var(--ink)}
.btn{font:inherit;font-size:16px;font-weight:500;width:100%;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);padding:15px 20px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.sections{padding:0 14px 20px;margin-top:-6px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:12px;overflow:hidden}
.acc{font:inherit;font-size:18px;color:var(--ink);background:none;border:0;width:100%;display:flex;align-items:center;gap:14px;padding:16px;cursor:pointer;text-align:left}
.acc .chev{margin-left:auto;transition:transform .2s}
.acc[aria-expanded="true"] .chev{transform:rotate(180deg)}
.body{padding:0 16px 8px}
.body[hidden]{display:none}
.row{display:flex;gap:16px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line);color:inherit;text-decoration:none}
.row small{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}
.row span{font-size:16px;overflow-wrap:anywhere}
.ico{flex:none;width:22px;height:22px;margin-top:10px;color:var(--muted)}
.note{padding:4px 0 14px;color:var(--muted);font-size:15px;line-height:1.5;margin:0}
.qrview{padding:12px 24px 32px;text-align:center}
.qrbox{background:var(--qrbg);border-radius:16px;padding:16px;display:inline-block;line-height:0}
.qrbox svg{width:220px;height:220px}
.qrview p{margin:18px 0 0;font-size:15px;color:var(--muted)}
.qrview strong{display:block;font-size:20px;color:var(--ink);margin-bottom:4px}
